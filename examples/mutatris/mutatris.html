#console.open{display:grid;grid-template-rows:1fr auto;gap:8px}#log{overflow:auto;white-space:pre-wrap}#command{width:100%;padding:8px;border:1px solid #57748c;background:#000;color:#fff;font:inherit;outline:none}

let muted=false;

function compile(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}

const vertex=`#version 300 es
layout(location=0) in vec2 in_pos;layout(location=1) in vec2 in_uv;out vec2 out_uv;
void main(){gl_Position=vec4(in_pos.x/640.0-1.0,1.0-in_pos.y/360.0,0,1);out_uv=in_uv;}`;
const spriteFrag=`#version 300 es
precision highp float;in vec2 out_uv;out vec4 out_color;uniform sampler2D sprite_tex;uniform float alpha;
void main(){vec4 c=texture(sprite_tex,out_uv);out_color=vec4(c.rgb,c.a*alpha);}`;
// WebGL translation of shaders/background.frag, used for direct file:// launches.
const backgroundFrag=`#version 300 es
precision highp float;in vec2 out_uv;out vec4 out_color;uniform sampler2D sprite_tex;
struct PC{float screenWidth;float screenHeight;float spritePosX;float spritePosY;float spriteSizeW;float spriteSizeH;float effectsOn;float padding2;vec4 params;};uniform PC pc;
float pingPong(float x,float n){float m=mod(x,n*2.0);return m<=n?m:n*2.0-m;}
void main(){vec2 tc=out_uv;float t=pc.params.x;vec2 uv=tc*2.0-1.0;uv.x*=pc.screenWidth/max(pc.screenHeight,1.0);float len=length(uv),tt=pingPong(t,10.0);float bubble=sin(smoothstep(.8,1.0,1.0-len)*tt);vec2 distort=sin(uv*(1.0+.1*sin(t+len*20.0))*tt);vec4 tex=texture(sprite_tex,distort*.5+.5);out_color=mix(tex,vec4(1),clamp(bubble,0.0,1.0));}`;
const crtFrag=`#version 300 es

const spriteProgram=link(vertex,spriteFrag),backgroundProgram=link(vertex,backgroundFrag),crtProgram=link(vertex,crtFrag);
const vao=gl.createVertexArray(),buffer=gl.createBuffer();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,16,0);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,2,gl.FLOAT,false,16,8);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

function effectUniforms(p,time){for(const [n,v] of [["pc.screenWidth",DW],["pc.screenHeight",DH],["pc.params",null]]){const l=gl.getUniformLocation(p,n);if(!l)continue;n==="pc.params"?gl.uniform4f(l,time,0,0,0):gl.uniform1f(l,v)}}
function convertShader(src){return src.replace("#version 450","#version 300 es\nprecision highp float;").replace(/layout\(location\s*=\s*0\)\s*in\s+vec2\s+out_uv\s*;/,"in vec2 out_uv;").replace(/layout\(location\s*=\s*0\)\s*out\s+vec4\s+out_color\s*;/,"out vec4 out_color;").replace(/layout\(binding\s*=\s*0\)\s*uniform\s+sampler2D\s+sprite_tex\s*;/,"uniform sampler2D sprite_tex;").replace(/layout\(push_constant\)\s*uniform\s+SpritePushConstants\s*\{([\s\S]*?)\}\s*pc\s*;/,"struct PC{$1}; uniform PC pc;")}

const textCanvas=document.createElement("canvas");textCanvas.width=DW;textCanvas.height=DH;const ctx=textCanvas.getContext("2d");let textTexture=null;
function clearText(){ctx.clearRect(0,0,DW,DH)}function txt(value,x,y,size=24,color="#fff",align="left",alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.font=`${size}px Mutatris, monospace`;ctx.textAlign=align;ctx.textBaseline="top";ctx.fillText(value,x,y);ctx.restore()}

const fbo=gl.createFramebuffer(),sceneTexture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,sceneTexture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,DW,DH,0,gl.RGBA,gl.UNSIGNED_BYTE,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,sceneTexture,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);

class Piece{constructor(grid){this.grid=grid;this.reset()}reset(){this.x=Math.floor(this.grid.w/2);this.y=0;do{this.colors=[rand(),rand(),rand()]}while(this.colors.every(v=>v===this.colors[0]));this.dir=0}cells(x=this.x,y=this.y,d=this.dir){return [[[x,y],[x,y+1],[x,y+2]],[[x,y],[x+1,y],[x+2,y]],[[x,y],[x-1,y],[x-2,y]],[[x,y],[x,y-1],[x,y-2]]][d]}valid(x=this.x,y=this.y,d=this.dir){return this.cells(x,y,d).every(([a,b])=>this.grid.at(a,b)===0)}left(){if(this.valid(this.x-1,this.y))this.x--}right(){if(this.valid(this.x+1,this.y))this.x++}shift(){this.colors.unshift(this.colors.pop())}rotate(){const d=(this.dir+1)%4;if(this.valid(this.x,this.y,d))this.dir=d}down(){if(this.valid(this.x,this.y+1)){this.y++;return false}return this.lock()}drop(){while(this.valid(this.x,this.y+1))this.y++;return this.lock()}lock(){const c=this.cells();if(!c.every(([x,y])=>this.grid.at(x,y)===0))return false;c.forEach(([x,y],i)=>this.grid.set(x,y,this.colors[i]));this.reset();return true}}
class Grid{constructor(w,h){this.w=w;this.h=h;this.data=new Int16Array(w*h);this.clearAt=new Float64Array(w*h);this.piece=new Piece(this)}index(x,y){return y*this.w+x}at(x,y){return x<0||y<0||x>=this.w||y>=this.h?-99:this.data[this.index(x,y)]}set(x,y,v){this.data[this.index(x,y)]=v}}
function rand(){return 1+Math.floor(Math.random()*7)}
let screen="startup",startupAt=performance.now(),difficulty=0,game=null,focus=0,lastDrop=0,gameClock=0,finalScore=0,finalClears=0,crt=false,shaderLevel=-1,backgroundIndex=0,effectIndex=0,assetsReady=false,lastFrame=0,inputAt=0,touchGesture=null;
const pointers=new Map(),DROP_DISTANCE=64,TAP_DISTANCE=18,TAP_TIME=350;
function newGame(){game={grids:[new Grid(GW,TH),new Grid(SW,SH),new Grid(GW,BH),new Grid(SW,SH)],score:0,clears:0,level:0,timeout:[1200,900,650][difficulty]};focus=0;gameClock=0;lastDrop=0;shaderLevel=-1;screen="playing";music();log(`New game. timeout=${game.timeout}`)}
function active(){return game.grids[focus].piece}function advance(){focus=focus===0?3:focus===3?2:focus===2?1:0;lastDrop=gameClock}
function endGame(){finalScore=game.score;finalClears=game.clears;screen="over";log(`Game over. score=${finalScore} clears=${finalClears}`)}
function settle(hard=false){const placed=hard?active().drop():active().down();if(placed){processGrid(4);advance()}else if(!active().valid())endGame()}
function cellBounds(g,x,y){if(g===0)return{x:CX+x*CELL,y:y*CELL,w:CELL,h:CELL};if(g===1)return{x:y*CELL,y:SY+x*CELL,w:CELL,h:CELL};if(g===2)return{x:CX+x*CELL,y:BY+(BH-1-y)*CELL,w:CELL,h:CELL};return{x:RX+(SH-1-y)*CELL,y:SY+(SW-1-x)*CELL,w:CELL,h:CELL}}
function findVisual(cur,color,dx,dy){const b=cellBounds(cur.g,cur.x,cur.y),ex=b.x*2+b.w,ey=b.y*2+b.h;let best=null,error=1e9;for(let g=0;g<4;g++){const grid=game.grids[g];for(let y=0;y<grid.h;y++)for(let x=0;x<grid.w;x++){if(g===cur.g&&x===cur.x&&y===cur.y||grid.at(x,y)!==color)continue;const q=cellBounds(g,x,y),qx=q.x*2+q.w,qy=q.y*2+q.h,xx=Math.abs((qx-ex)-(dx?dx*(b.w+q.w):0)),yy=Math.abs((qy-ey)-(dy?dy*(b.h+q.h):0));if(xx<=18&&yy<=18&&xx*xx+yy*yy<error){error=xx*xx+yy*yy;best={g,x,y}}}}return best}
function mark(cells,now=performance.now()){for(const c of cells){const q=game.grids[c.g],i=q.index(c.x,c.y);q.data[i]=-1;q.clearAt[i]=now}game.score++;game.clears++;if(game.clears%8===0){game.timeout=Math.max(125,game.timeout-100);game.level=Math.max(0,Math.min(10,Math.floor((1200-game.timeout)/100)))}play(audio.line)}
function clearVisual(){for(let g=0;g<4;g++){const grid=game.grids[g];for(let y=0;y<grid.h;y++)for(let x=0;x<grid.w;x++){const color=grid.at(x,y);if(color<=0)continue;for(const [dx,dy]of[[1,0],[0,1],[1,1],[-1,1]]){const start={g,x,y};if(findVisual(start,color,-dx,-dy))continue;const run=[start];let c=start,n;while((n=findVisual(c,color,dx,dy))&&!run.some(v=>v.g===n.g&&v.x===n.x&&v.y===n.y)){run.push(n);c=n}if(run.length>=3){mark(run);return true}}}}return false}
function clearLocal(){for(let g=0;g<4;g++){const grid=game.grids[g];for(let x=0;x<grid.w;x++)for(let y=0;y<grid.h;y++){const color=grid.at(x,y);if(color<=0)continue;for(const [dx,dy]of[[0,1],[1,0],[1,1],[-1,1]]){if(grid.at(x-dx,y-dy)===color)continue;const run=[];let a=x,b=y;while(grid.at(a,b)===color){run.push({g,x:a,y:b});a+=dx;b+=dy}if(run.length>=3){mark(run);return true}}}}return false}

function bg(now){const item=effects[effectIndex]||effects[0],tex=textures[`blocks${backgroundIndex||""}.png`];gl.useProgram(item.program);effectUniforms(item.program,now/1000);quad(tex,0,0,DW,DH,1,0,item.program)}

function board(now){for(let g=0;g<4;g++){const grid=game.grids[g];frame(g,g===focus);for(let y=0;y<grid.h;y++)for(let x=0;x<grid.w;x++)drawCell(g,x,y,grid.at(x,y),now);if(g===focus){const p=grid.piece;p.cells().forEach(([x,y],i)=>{if(x>=0&&y>=0)drawCell(g,x,y,p.colors[i],now)})}}}
function startup(now){const e=now-startupAt,F=2520,HOLD=900;if(e<F)quad(textures["lostlogo.png"],0,0,DW,DH,e/F);else if(e<F*2)quad(textures["lostlogo.png"],0,0,DW,DH,1-(e-F)/F);else if(e<F*3)quad(textures["jblogo.png"],0,0,DW,DH,(e-F*2)/F);else if(e<F*3+HOLD)quad(textures["jblogo.png"],0,0,DW,DH);else if(e<F*4+HOLD)quad(textures["jblogo.png"],0,0,DW,DH,1-(e-F*3-HOLD)/F);else if(e<F*5+HOLD)title((e-F*4-HOLD)/F);else screen="title"}
function title(alpha=1){quad(textures["intro.png"],0,0,DW,DH,alpha);txt("[Press Enter to Play]",25,25,24,"#fff","left",alpha);txt("Mutatris",50,250,72,"#fff","left",alpha);txt("Drag to move  Tap to shift colors  Two-finger tap to rotate",25,610,20,"#ddd","left",alpha);txt("Swipe with gravity to hard drop",25,640,20,"#ddd","left",alpha);txt("lostsidedead.biz",780,670,24,"#5078ff","left",alpha)}
function difficultyScreen(){quad(textures["start.png"],0,0,DW,DH);txt("Mutatris",560,325,32);txt("Press Space",638,570,20,"#fff","center");["Easy","Medium","Hard"].forEach((s,i)=>txt(s,430+i*180,475,26,i===difficulty?"#ffe640":"#fff"))}
function gameOverScreen(){quad(textures[finalScore>=200?"highscore.png":"gameover.png"],0,0,DW,DH);txt(`${finalScore>=200?"High Score":"Game Over Score"}: ${finalScore}  Clears: ${finalClears}`,25,25,24);txt("[ Press Space ]",25,finalScore>=200?400:100,24)}
function render(now){gl.viewport(0,0,DW,DH);gl.bindFramebuffer(gl.FRAMEBUFFER,crt?fbo:null);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);clearText();if(screen==="startup")startup(now);else if(screen==="title")title();else if(screen==="difficulty")difficultyScreen();else if(screen==="playing"){bg(now);board(now);txt(`Level: ${game.level+1}  Timeout: ${game.timeout}`,25,25);txt(`Score: ${game.score}`,25,55);txt(`Direction: ${focus}`,25,85)}else gameOverScreen();drawTextLayer();if(crt){gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.clear(gl.COLOR_BUFFER_BIT);quad(sceneTexture,0,DH,DW,-DH,1,0,crtProgram)}}
function update(dt,now){if(screen!=="playing")return;gameClock+=dt;let cleared=false;for(const grid of game.grids)for(let i=0;i<grid.data.length;i++)if(grid.data[i]<0&&now-grid.clearAt[i]>=CLEAR_MS){grid.data[i]=0;grid.clearAt[i]=0;cleared=true}if(cleared)processGrid(1);processGrid(1);if(gameClock-lastDrop>=game.timeout){lastDrop=gameClock;settle(false)}if(game.level!==shaderLevel){shaderLevel=game.level;backgroundIndex=Math.floor(Math.random()*11);effectIndex=Math.floor(Math.random()*effects.length);log(`Level ${game.level+1}: blocks${backgroundIndex||""}.png / ${effects[effectIndex].name}`)}}
function confirm(){music();if(screen==="startup")screen="title";else if(screen==="title")screen="difficulty";else if(screen==="difficulty")newGame();else if(screen==="over")screen="title"}
function direction(code){if(screen!=="playing")return;const now=performance.now();if(now-inputAt<120)return;inputAt=now;const p=active(),maps=[{ArrowLeft:()=>p.left(),ArrowRight:()=>p.right(),ArrowUp:()=>p.shift(),ArrowDown:()=>settle()},{ArrowUp:()=>p.left(),ArrowDown:()=>p.right(),ArrowLeft:()=>p.shift(),ArrowRight:()=>settle()},{ArrowLeft:()=>p.left(),ArrowRight:()=>p.right(),ArrowDown:()=>p.shift(),ArrowUp:()=>settle()},{ArrowDown:()=>p.left(),ArrowUp:()=>p.right(),ArrowRight:()=>p.shift(),ArrowLeft:()=>settle()}];maps[focus][code]?.()}
function pointerDelta(pointer,e){const rect=canvas.getBoundingClientRect(),dx=(e.clientX-pointer.startX)*DW/rect.width,dy=(e.clientY-pointer.startY)*DH/rect.height;return{dx,dy,drop:[dy,dx,-dy,-dx][pointer.focus],side:[dx,dy,dx,dy][pointer.focus]}}
function tappedDifficulty(e){const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*DW/rect.width,y=(e.clientY-rect.top)*DH/rect.height;if(y<440||y>525)return-1;if(x>=390&&x<570)return 0;if(x>=570&&x<750)return 1;if(x>=750&&x<=970)return 2;return-1}
function dragPiece(pointer,e){if(pointer.focus!==focus)return;const rect=canvas.getBoundingClientRect(),dx=(e.clientX-pointer.startX)*DW/rect.width,dy=(e.clientY-pointer.startY)*DH/rect.height,visualDelta=focus===0||focus===2?dx:focus===1?dy:-dy,target=Math.round(pointer.pieceX+visualDelta/CELL),piece=active();while(piece.x<target&&piece.valid(piece.x+1,piece.y))piece.x++;while(piece.x>target&&piece.valid(piece.x-1,piece.y))piece.x--}
addEventListener("keydown",e=>{if(consoleBox.classList.contains("open")&&e.code!=="F3")return;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();if(e.code==="F3"){consoleBox.classList.toggle("open");if(consoleBox.classList.contains("open"))command.focus();else canvas.focus();return}if(e.code==="F8"){crt=!crt;return}if(e.code==="Escape"){if(screen==="playing"){game=null;screen="difficulty"}return}if(screen==="startup"){confirm();return}if((e.code==="Enter"||e.code==="Space")&&screen!=="playing"){confirm();return}if(screen==="difficulty"){if(e.code==="ArrowLeft")difficulty=Math.max(0,difficulty-1);if(e.code==="ArrowRight")difficulty=Math.min(2,difficulty+1);return}if(screen!=="playing")return;if(e.code==="KeyW")active().shift();else if(e.code==="KeyA"||e.code==="Space")active().rotate();else if(e.code==="KeyS")settle(true);else direction(e.code)});
canvas.addEventListener("pointerdown",e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,pieceX:screen==="playing"?active().x:0,focus,mode:null});if(!touchGesture)touchGesture={started:performance.now(),moved:false,multi:false,startScreen:screen};if(pointers.size>1)touchGesture.multi=true;music()});
canvas.addEventListener("pointermove",e=>{const p=pointers.get(e.pointerId);if(!p||!touchGesture)return;e.preventDefault();const totalX=e.clientX-p.startX,totalY=e.clientY-p.startY;if(Math.hypot(totalX,totalY)>TAP_DISTANCE)touchGesture.moved=true;if(screen!=="playing"||touchGesture.multi){p.x=e.clientX;p.y=e.clientY;return}const delta=pointerDelta(p,e);if(!p.mode&&Math.hypot(delta.dx,delta.dy)>TAP_DISTANCE)p.mode=delta.drop>0&&delta.drop>Math.abs(delta.side)*.8?"drop":"move";if(p.mode==="move")dragPiece(p,e);p.x=e.clientX;p.y=e.clientY});
function endPointer(e){const p=pointers.get(e.pointerId);if(!p||!touchGesture)return;pointers.delete(e.pointerId);if(pointers.size)return;const gesture=touchGesture;touchGesture=null;if(gesture.startScreen!=="playing"){if(!gesture.moved&&performance.now()-gesture.started<TAP_TIME){if(gesture.startScreen==="difficulty"){const tapped=tappedDifficulty(e);if(tapped>=0)difficulty=tapped}confirm()}return}if(screen!=="playing")return;const delta=pointerDelta(p,e);if(!gesture.multi&&p.focus===focus&&p.mode==="drop"&&delta.drop>DROP_DISTANCE){settle(true);return}if(gesture.moved||performance.now()-gesture.started>=TAP_TIME)return;if(gesture.multi)active().rotate();else active().shift()}
canvas.addEventListener("pointerup",endPointer);canvas.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);if(!pointers.size)touchGesture=null});
function log(s){logBox.textContent+=`${s}\n`;logBox.scrollTop=logBox.scrollHeight}log("Press F3 to open/close the console.\nType 'help' for commands.");
command.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const raw=command.value.trim(),a=raw.split(/\s+/);command.value="";log(`mutatris> ${raw}`);if(a[0]==="help")log("help  clear  echo <text>  switch_shader  about  quit");else if(a[0]==="clear")logBox.textContent="";else if(a[0]==="echo")log(a.slice(1).join(" "));else if(a[0]==="switch_shader"){backgroundIndex=Math.floor(Math.random()*11);effectIndex=Math.floor(Math.random()*effects.length);log(`Switched to blocks${backgroundIndex||""}.png / ${effects[effectIndex].name}`)}else if(a[0]==="about")log("Mutatris: rotating-grid puzzle game, HTML5/WebGL 2 port.");else if(a[0]==="quit"||a[0]==="exit")location.href="about:blank";else if(raw)log("Unknown command.")});
document.querySelector("#sound").onclick=e=>{muted=!muted;audio.music.muted=muted;e.currentTarget.textContent=muted?"×":"♪"};document.querySelector("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.querySelector("#stage").requestFullscreen();
async function load(){await Promise.all(imageFiles.map(name=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images[name]=i;textures[name]=texture(i);resolve()};i.onerror=()=>reject(Error(`Missing data/${name}`));i.src=`data/${name}`})));await document.fonts.load("24px Mutatris");await loadEffects();assetsReady=true;status.style.display="none";play(audio.open);startupAt=performance.now();requestAnimationFrame(loop)}
function loop(now){const dt=Math.min(50,now-lastFrame||0);lastFrame=now;update(dt,now);render(now);requestAnimationFrame(loop)}
load().catch(e=>{console.error(e);status.textContent=`LOAD ERROR: ${e.message}`});
</script>
</body>
